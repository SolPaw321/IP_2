[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-ii-lab"
version = "0.1.0"
description = "Impulse-noise removal from music recordings using AR(4) and EW-LS"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<3",
]

[tool.setuptools]
packages = ["ip_ii"]
